<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Den — preview</title>
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface-alt: #21262D;
    --border: #30363D;
    --accent: #F5A623;
    --text: #E6EDF3;
    --text-muted: #8B949E;
    --sky-top: #1A2744;
    --sky-bottom: #2D4A7A;
    --bubble-me: #1F3A5F;
    --bubble-them: #21262D;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  /* Phone frame — mimics iPhone proportions so the preview feels like a real device */
  .phone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at top, #1c1f2e 0%, #07090f 70%);
  }
  .screen {
    width: 390px;
    height: 844px;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    box-shadow:
      0 0 0 6px #1a1a1f,
      0 0 0 8px #2a2a30,
      0 20px 60px rgba(0,0,0,0.6);
  }
  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
  }
  canvas#room {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  /* ── Top bar ────────────────────────────────────────── */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px 8px;
    display: flex; align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(22,27,34,0.85);
    border: 1px solid rgba(48,54,61,0.6);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
  }
  .room-chip {
    padding: 6px 12px;
    background: rgba(22,27,34,0.85);
    border: 1px solid rgba(48,54,61,0.6);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .room-chip .home { color: var(--accent); }

  /* ── Slim chat input bar (always visible) ───────────────────── */
  .input-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 5;                /* sits above the keyboard */
    box-shadow: 0 -2px 12px rgba(0,0,0,0.35);
    transition: bottom 240ms cubic-bezier(.4,0,.2,1);
  }
  /* When the keyboard is open, the input bar rides on top of it */
  .input-bar.kbd-open { bottom: 296px; }
  .input-bar .lock { color: var(--accent); font-size: 12px; margin-left: 4px; }
  .input-bar input {
    flex: 1;
    background: var(--surface-alt);
    border: 1px solid transparent;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 22px;
    font-size: 14px;
    outline: none;
    transition: border-color 150ms, background 150ms;
  }
  .input-bar input:focus {
    border-color: var(--accent);
    background: #2a3038;
  }
  .input-bar input::placeholder { color: var(--text-muted); }
  .send {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
  }
  .send:active { transform: scale(0.94); }

  /* ── Faux mobile keyboard (preview only) ──────────────────── */
  .keyboard {
    position: absolute;
    left: 0; right: 0;
    bottom: -300px;             /* hidden by default */
    height: 296px;
    background: linear-gradient(to bottom, #2a2d33, #1a1c20);
    border-top: 1px solid #000;
    padding: 6px 4px 8px;
    transition: bottom 240ms cubic-bezier(.4,0,.2,1);
    z-index: 4;                 /* below the input bar */
    display: flex; flex-direction: column; gap: 6px;
  }
  .keyboard.open { bottom: 0; }  /* sits flush at the very bottom */
  .kbd-row {
    display: flex; gap: 4px; justify-content: center;
    flex: 1;
  }
  .key {
    flex: 1;
    max-width: 36px;
    background: #4a4e57;
    color: #fff;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 1px 0 #000;
  }
  .key.wide { max-width: 52px; }
  .key.space { max-width: 180px; flex: 5; }
  .key.dark { background: #2e3138; }

  /* ── Avatar customiser modal ───────────────────────────────────── */
  .customiser {
    position: absolute;
    inset: 0;
    background: rgba(13,17,23,0.92);
    backdrop-filter: blur(4px);
    z-index: 10;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(.4,0,.2,1);
  }
  .customiser.open { transform: translateY(0); }
  .cust-header {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .cust-header .title {
    font-weight: 600; font-size: 16px;
    color: var(--text);
  }
  .cust-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    cursor: pointer; font-size: 16px;
  }
  .cust-save {
    margin-left: auto;
    padding: 7px 16px;
    background: var(--accent);
    color: #000;
    border: none; border-radius: 16px;
    font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .preview-stage {
    height: 200px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to bottom, #20324a, #18223a);
  }
  canvas#avatarPreview {
    image-rendering: pixelated; image-rendering: crisp-edges;
    width: 160px; height: 280px;
  }
  .cust-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .cust-tab {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .cust-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .cust-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 24px;
  }
  .cust-section-label {
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 12px 0 8px;
  }
  .cust-section-label:first-child { margin-top: 0; }
  .styles-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .style-chip {
    flex: 0 0 auto;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
    transition: border-color 120ms, transform 120ms;
  }
  .style-chip.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .style-chip canvas {
    width: 48px; height: 84px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .style-chip .lbl {
    font-size: 11px; color: var(--text); font-weight: 500;
  }
  .colors-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: transform 120ms, border-color 120ms;
  }
  .color-swatch.active {
    border-color: var(--accent);
    transform: scale(1.1);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .profile-icon {
    cursor: pointer;
  }

  /* Status label below the device for context */
  .meta {
    position: fixed; bottom: 12px; left: 0; right: 0;
    text-align: center;
    color: #888;
    font-size: 11px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="sky"></div>
    <canvas id="room" width="390" height="844"></canvas>

    <div class="topbar">
      <div class="icon-btn" id="back">&lt;</div>
      <div class="room-chip">
        <span class="home">⌂</span>
        <span>demo_friend's den</span>
      </div>
      <div style="flex:1"></div>
      <div class="icon-btn profile-icon" id="profile" title="Customise avatar">●</div>
    </div>

    <!-- Avatar customiser modal -->
    <div class="customiser" id="customiser">
      <div class="cust-header">
        <div class="cust-close" id="custClose">×</div>
        <div class="title">My avatar</div>
        <button class="cust-save" id="custSave">Save</button>
      </div>
      <div class="preview-stage">
        <canvas id="avatarPreview" width="32" height="56"></canvas>
      </div>
      <div class="cust-tabs" id="custTabs">
        <div class="cust-tab active" data-tab="hair">Hair</div>
        <div class="cust-tab" data-tab="skin">Skin</div>
        <div class="cust-tab" data-tab="shirt">Shirt</div>
        <div class="cust-tab" data-tab="pants">Pants</div>
      </div>
      <div class="cust-content" id="custContent"></div>
    </div>

    <!-- Slim chat input bar — always visible -->
    <div class="input-bar">
      <span class="lock">🔒</span>
      <input id="msgInput" type="text" placeholder="Say something..." />
      <button class="send" id="sendBtn">→</button>
    </div>

    <!-- Faux mobile keyboard so the preview shows what real users will see -->
    <div class="keyboard" id="keyboard">
      <div class="kbd-row">
        <div class="key">q</div><div class="key">w</div><div class="key">e</div>
        <div class="key">r</div><div class="key">t</div><div class="key">y</div>
        <div class="key">u</div><div class="key">i</div><div class="key">o</div>
        <div class="key">p</div>
      </div>
      <div class="kbd-row">
        <div class="key">a</div><div class="key">s</div><div class="key">d</div>
        <div class="key">f</div><div class="key">g</div><div class="key">h</div>
        <div class="key">j</div><div class="key">k</div><div class="key">l</div>
      </div>
      <div class="kbd-row">
        <div class="key wide dark">⇧</div>
        <div class="key">z</div><div class="key">x</div><div class="key">c</div>
        <div class="key">v</div><div class="key">b</div><div class="key">n</div>
        <div class="key">m</div>
        <div class="key wide dark">⌫</div>
      </div>
      <div class="kbd-row">
        <div class="key wide dark">123</div>
        <div class="key dark">,</div>
        <div class="key space">space</div>
        <div class="key dark">.</div>
        <div class="key wide dark">↵</div>
      </div>
    </div>
  </div>
</div>
<div class="meta">Tap a floor tile to walk. Tap the bottom bar to open chat.</div>

<!-- v query busts the browser cache when these files change -->
<script src="wardrobe.js?v=4"></script>
<script src="furniture.js?v=4"></script>
<script src="renderer.js?v=4"></script>
<script src="customiser.js?v=4"></script>
</body>
</html>
