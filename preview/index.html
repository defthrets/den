<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Den — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --surface: #161B22;
    --surface-alt: #21262D;
    --border: #30363D;
    --accent: #F5A623;
    --text: #E6EDF3;
    --text-muted: #8B949E;
    --sky-top: #1A2744;
    --sky-bottom: #2D4A7A;
    --bubble-me: #1F3A5F;
    --bubble-them: #21262D;
    --pixel-shadow: 2px 2px 0 #000;
    --pixel-shadow-lg: 3px 3px 0 #000;
    --pixel-font: 'Pixelify Sans', 'Courier New', monospace;
    --pixel-font-hud: 'Press Start 2P', 'Courier New', monospace;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: grayscale;
    font-smooth: never;
    text-rendering: geometricPrecision;
  }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000;
    font-family: var(--pixel-font);
    color: var(--text);
    overflow: hidden;
    image-rendering: pixelated;
  }
  /* Phone frame — mimics iPhone proportions so the preview feels like a real device */
  .phone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at top, #1c1f2e 0%, #07090f 70%);
  }
  .screen {
    width: 390px;
    height: 844px;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    box-shadow:
      0 0 0 4px #1a1a1f,
      0 0 0 8px #2a2a30,
      8px 8px 0 rgba(0,0,0,0.6);
  }
  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
  }
  canvas#room {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }

  /* ── Top bar ────────────────────────────────────────── */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px 8px;
    display: flex; align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 0;
    background: var(--surface);
    border: 2px solid var(--text);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    cursor: pointer;
    font-family: var(--pixel-font);
    font-size: 18px;
    box-shadow: var(--pixel-shadow);
  }
  .icon-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 #000;
  }
  .room-chip {
    padding: 6px 10px;
    background: var(--surface);
    border: 2px solid var(--text);
    border-radius: 0;
    font-family: var(--pixel-font);
    font-size: 14px;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    box-shadow: var(--pixel-shadow);
  }
  .room-chip .home { color: var(--accent); font-size: 16px; }

  /* ── Slim chat input bar (always visible) ───────────────────── */
  .input-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border-top: 2px solid var(--text);
    z-index: 5;
    transition: bottom 240ms cubic-bezier(.4,0,.2,1),
                transform 200ms cubic-bezier(.4,0,.2,1);
  }
  .input-bar.kbd-open { bottom: 296px; }
  .input-bar .lock { color: var(--accent); font-size: 14px; margin-left: 4px; }
  .input-bar input {
    flex: 1;
    background: var(--surface-alt);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 0;
    font-family: var(--pixel-font);
    font-size: 16px;
    outline: none;
    transition: border-color 100ms, background 100ms;
  }
  .input-bar input:focus {
    border-color: var(--accent);
    background: #2a3038;
  }
  .input-bar input::placeholder { color: var(--text-muted); }
  .send {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 0;
    border: 2px solid #000;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    cursor: pointer;
    font-family: var(--pixel-font);
    font-weight: bold;
    font-size: 22px;
    box-shadow: var(--pixel-shadow);
  }
  .send:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }

  /* ── Faux mobile keyboard (preview only) ──────────────────── */
  .keyboard {
    position: absolute;
    left: 0; right: 0;
    bottom: -300px;             /* hidden by default */
    height: 296px;
    background: linear-gradient(to bottom, #2a2d33, #1a1c20);
    border-top: 1px solid #000;
    padding: 6px 4px 8px;
    transition: bottom 240ms cubic-bezier(.4,0,.2,1);
    z-index: 4;                 /* below the input bar */
    display: flex; flex-direction: column; gap: 6px;
  }
  .keyboard.open { bottom: 0; }  /* sits flush at the very bottom */
  .kbd-row {
    display: flex; gap: 4px; justify-content: center;
    flex: 1;
  }
  .key {
    flex: 1;
    max-width: 36px;
    background: #4a4e57;
    color: #fff;
    border: 1px solid #000;
    border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--pixel-font);
    font-size: 16px;
    font-weight: 500;
    box-shadow: 0 2px 0 #000;
  }
  .key.wide { max-width: 52px; }
  .key.space { max-width: 180px; flex: 5; }
  .key.dark { background: #2e3138; }

  /* ── Avatar customiser modal ───────────────────────────────────── */
  .customiser {
    position: absolute;
    inset: 0;
    background: rgba(13,17,23,0.92);
    backdrop-filter: blur(4px);
    z-index: 10;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 280ms cubic-bezier(.4,0,.2,1);
  }
  .customiser.open { transform: translateY(0); }
  .cust-header {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 2px solid var(--border);
  }
  .cust-header .title {
    font-family: var(--pixel-font-hud);
    font-weight: 400; font-size: 12px;
    color: var(--text);
    letter-spacing: 1px;
  }
  .cust-close {
    width: 32px; height: 32px;
    border-radius: 0;
    background: var(--surface-alt);
    border: 2px solid var(--text);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    cursor: pointer;
    font-family: var(--pixel-font);
    font-size: 18px;
    box-shadow: var(--pixel-shadow);
  }
  .cust-close:active { transform: translate(2px,2px); box-shadow: 0 0 0 #000; }
  .cust-save {
    margin-left: auto;
    padding: 8px 14px;
    background: var(--accent);
    color: #000;
    border: 2px solid #000;
    border-radius: 0;
    font-family: var(--pixel-font);
    font-weight: 700; font-size: 14px;
    cursor: pointer;
    box-shadow: var(--pixel-shadow);
  }
  .cust-save:active { transform: translate(2px,2px); box-shadow: 0 0 0 #000; }
  .preview-stage {
    height: 200px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to bottom, #20324a, #18223a);
  }
  canvas#avatarPreview {
    image-rendering: pixelated; image-rendering: crisp-edges;
    width: 160px; height: 280px;
  }
  .cust-tabs {
    display: flex;
    border-bottom: 2px solid var(--border);
    background: var(--surface);
  }
  .cust-tab {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    color: var(--text-muted);
    font-family: var(--pixel-font);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .cust-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .cust-content {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 24px;
  }
  .cust-section-label {
    color: var(--text-muted);
    font-family: var(--pixel-font-hud);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 14px 0 10px;
  }
  .cust-section-label:first-child { margin-top: 0; }
  .styles-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .style-chip {
    flex: 0 0 auto;
    background: var(--surface-alt);
    border: 2px solid var(--border);
    border-radius: 0;
    padding: 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .style-chip.active {
    border-color: var(--accent);
    box-shadow: var(--pixel-shadow);
  }
  .style-chip canvas {
    width: 48px; height: 84px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .style-chip .lbl {
    font-family: var(--pixel-font);
    font-size: 13px; color: var(--text); font-weight: 500;
  }
  .colors-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 0;
    border: 2px solid var(--border);
    cursor: pointer;
  }
  .color-swatch.active {
    border-color: var(--accent);
    box-shadow: var(--pixel-shadow);
  }
  .profile-icon {
    cursor: pointer;
  }

  /* ── Room editor panel ────────────────────────────────────────── */
  .editor-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 2px solid var(--text);
    z-index: 6;
    transform: translateY(100%);
    transition: transform 240ms cubic-bezier(.4,0,.2,1);
  }
  .editor-panel.open { transform: translateY(0); }
  .editor-header {
    display: flex; align-items: center;
    padding: 10px 14px;
    border-bottom: 2px solid var(--border);
  }
  .editor-title {
    font-family: var(--pixel-font-hud);
    font-size: 9px; font-weight: 400; color: var(--text);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .editor-hint {
    margin-left: 10px;
    font-family: var(--pixel-font);
    font-size: 12px; color: var(--text-muted);
    flex: 1;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .editor-mode {
    padding: 6px 12px;
    margin-right: 8px;
    background: var(--surface-alt);
    color: var(--text);
    border: 2px solid var(--text);
    border-radius: 0;
    font-family: var(--pixel-font);
    font-weight: 600; font-size: 14px;
    cursor: pointer;
    box-shadow: var(--pixel-shadow);
  }
  .editor-mode:active { transform: translate(2px,2px); box-shadow: 0 0 0 #000; }
  .editor-mode.active {
    background: var(--accent);
    color: #000;
    border-color: #000;
  }
  .editor-done {
    padding: 6px 14px;
    background: var(--accent);
    color: #000;
    border: 2px solid #000;
    border-radius: 0;
    font-family: var(--pixel-font);
    font-weight: 700; font-size: 14px;
    cursor: pointer;
    box-shadow: var(--pixel-shadow);
  }
  .editor-done:active { transform: translate(2px,2px); box-shadow: 0 0 0 #000; }
  /* Slight raise + glow on the picked-up item so it's obvious it's being moved */
  body.editor-picked-up canvas#room { cursor: grab; }
  .editor-palette {
    padding: 0 0 16px;
  }
  .palette-tabs {
    display: flex; gap: 4px;
    padding: 8px 14px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }
  .palette-tab {
    flex: 0 0 auto;
    padding: 5px 10px;
    background: var(--surface-alt);
    color: var(--text-muted);
    border: 2px solid var(--border);
    border-radius: 0;
    font-family: var(--pixel-font);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .palette-tab.active {
    background: var(--accent);
    color: #000;
    border-color: #000;
    box-shadow: var(--pixel-shadow);
  }
  .palette-row {
    display: flex; gap: 8px;
    padding: 10px 14px 6px;
    overflow-x: auto;
  }
  .palette-chip {
    flex: 0 0 auto;
    width: 72px; height: 88px;
    background: var(--surface-alt);
    border: 2px solid var(--border);
    border-radius: 0;
    padding: 4px;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
  }
  .palette-chip.active {
    border-color: var(--accent);
    background: #2a3038;
    box-shadow: var(--pixel-shadow);
  }
  .palette-chip canvas {
    width: 60px; height: 60px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .palette-chip .lbl {
    font-family: var(--pixel-font);
    font-size: 11px; color: var(--text); margin-top: 2px;
    text-align: center; line-height: 1.1;
  }

  /* Room edges glow in edit mode so it's clear you're decorating */
  body.editing canvas#room { filter: brightness(1.05); }

  /* Status label below the device for context */
  .meta {
    position: fixed; bottom: 12px; left: 0; right: 0;
    text-align: center;
    color: #888;
    font-family: var(--pixel-font);
    font-size: 13px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="sky"></div>
    <canvas id="room" width="390" height="844"></canvas>

    <div class="topbar">
      <div class="icon-btn" id="back">&lt;</div>
      <div class="room-chip">
        <span class="home">⌂</span>
        <span>demo_friend's den</span>
      </div>
      <div style="flex:1"></div>
      <div class="icon-btn" id="editBtn" title="Edit room">✎</div>
      <div class="icon-btn profile-icon" id="profile" title="Customise avatar">●</div>
    </div>

    <!-- Room editor palette (hidden until edit mode) -->
    <div class="editor-panel" id="editorPanel">
      <div class="editor-header">
        <div class="editor-title" id="editorTitle">Place furniture</div>
        <div class="editor-hint" id="editorHint">tap tile to place · tap item to rotate · long-press to delete</div>
        <button class="editor-mode" id="editorMode">Move</button>
        <button class="editor-done" id="editorDone">Done</button>
      </div>
      <div class="editor-palette" id="editorPalette"></div>
    </div>

    <!-- Avatar customiser modal -->
    <div class="customiser" id="customiser">
      <div class="cust-header">
        <div class="cust-close" id="custClose">×</div>
        <div class="title">My avatar</div>
        <button class="cust-save" id="custSave">Save</button>
      </div>
      <div class="preview-stage">
        <canvas id="avatarPreview" width="32" height="56"></canvas>
      </div>
      <div class="cust-tabs" id="custTabs">
        <div class="cust-tab active" data-tab="hair">Hair</div>
        <div class="cust-tab" data-tab="skin">Skin</div>
        <div class="cust-tab" data-tab="shirt">Shirt</div>
        <div class="cust-tab" data-tab="pants">Pants</div>
      </div>
      <div class="cust-content" id="custContent"></div>
    </div>

    <!-- Slim chat input bar — always visible -->
    <div class="input-bar">
      <span class="lock">🔒</span>
      <input id="msgInput" type="text" placeholder="Say something..." />
      <button class="send" id="sendBtn">→</button>
    </div>

    <!-- Faux mobile keyboard so the preview shows what real users will see -->
    <div class="keyboard" id="keyboard">
      <div class="kbd-row">
        <div class="key">q</div><div class="key">w</div><div class="key">e</div>
        <div class="key">r</div><div class="key">t</div><div class="key">y</div>
        <div class="key">u</div><div class="key">i</div><div class="key">o</div>
        <div class="key">p</div>
      </div>
      <div class="kbd-row">
        <div class="key">a</div><div class="key">s</div><div class="key">d</div>
        <div class="key">f</div><div class="key">g</div><div class="key">h</div>
        <div class="key">j</div><div class="key">k</div><div class="key">l</div>
      </div>
      <div class="kbd-row">
        <div class="key wide dark">⇧</div>
        <div class="key">z</div><div class="key">x</div><div class="key">c</div>
        <div class="key">v</div><div class="key">b</div><div class="key">n</div>
        <div class="key">m</div>
        <div class="key wide dark">⌫</div>
      </div>
      <div class="kbd-row">
        <div class="key wide dark">123</div>
        <div class="key dark">,</div>
        <div class="key space">space</div>
        <div class="key dark">.</div>
        <div class="key wide dark">↵</div>
      </div>
    </div>
  </div>
</div>
<div class="meta">Tap a floor tile to walk. Tap the bottom bar to open chat.</div>

<!-- v query busts the browser cache when these files change -->
<script src="wardrobe.js?v=43"></script>
<script src="styles.js?v=43"></script>
<script src="furniture-archive.js?v=43"></script>
<script src="furniture.js?v=43"></script>
<script src="renderer.js?v=43"></script>
<script src="customiser.js?v=43"></script>
<script src="editor.js?v=43"></script>
</body>
</html>
